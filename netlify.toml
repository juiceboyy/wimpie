[build]
  command = "node build-releases.js && node build-podcasts.js"
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "CLAUDE.md"
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_PIN"

[functions]
  directory = "netlify/functions"
  included_files = ["data/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/begeleiders"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/begeleiders.html"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/boeken"
  to = "/boeken.html"
  status = 200

[[redirects]]
  from = "/podcast"
  to = "/podcast.html"
  status = 200

[[redirects]]
  from = "/s/:slug"
  to = "/s/:slug/index.html"
  status = 200

[[redirects]]
  from = "/s"
  to = "/s/index.html"
  status = 200

[[redirects]]
  from = "/kaart"
  to = "/kaart/index.html"
  status = 200

[build]
  command = "node build-releases.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/begeleiders"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/begeleiders.html"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/boeken"
  to = "/boeken.html"
  status = 200

[[redirects]]
  from = "/s/:slug"
  to = "/s/:slug/index.html"
  status = 200

[[redirects]]
  from = "/s"
  to = "/s/index.html"
  status = 200

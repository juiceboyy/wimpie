<!DOCTYPE html>
<html lang="nl" class="scroll-smooth bg-[#0C0C0C]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | {{ARTIST}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta property="og:title" content="{{TITLE}} - {{ARTIST}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="{{ARTWORK}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind = window.tailwind || {};
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Fraunces', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        accent: {
                            DEFAULT: '#C85A32',
                            hover: '#B34E2A',
                        }
                    }
                }
            }
        };
    </script>
    <script src="/single.js" defer></script>
</head>

<body class="relative bg-[#0C0C0C] text-[#FDFBF7] font-sans antialiased selection:bg-[#C85A32] selection:text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Ambient Atmospheric Artwork in de achtergrond -->
    <div class="fixed inset-0 pointer-events-none select-none overflow-hidden z-0" aria-hidden="true">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/4 w-[550px] sm:w-[800px] aspect-square rounded-full overflow-hidden opacity-55 blur-3xl saturate-150 transform scale-110">
            <img src="{{ARTWORK}}" alt="" class="w-full h-full object-cover">
        </div>
        <div class="absolute inset-0 bg-radial from-transparent via-[#0C0C0C]/60 to-[#0C0C0C]"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-[#0C0C0C]/60 via-transparent to-[#0C0C0C]"></div>
    </div>

    <!-- Top Micro-Bar -->
    <header class="relative z-10 sticky top-0 bg-[#0C0C0C]/90 backdrop-blur-md shadow-[0_1px_0_0_rgba(255,255,255,0.08)] px-4 sm:px-8 py-3">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-3">
            <a href="/" class="flex items-center gap-2 text-xs font-mono tracking-[0.2em] text-neutral-300 uppercase hover:text-white transition">
                <span class="w-2 h-2 rounded-full bg-[#C85A32] animate-pulse"></span>
                <span>{{ARTIST}}</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="/wall-of-fame.html" class="text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-white transition">
                    Wall of Fame
                </a>
                <a href="/boeken.html" class="text-xs font-mono uppercase tracking-wider text-neutral-400 hover:text-white transition">
                    Boek optreden
                </a>
                <a href="/" class="h-8 px-3 rounded-full bg-white/10 hover:bg-white/20 text-neutral-200 text-xs font-mono uppercase tracking-wider flex items-center gap-1.5 shadow-[0_0_0_1px_rgba(255,255,255,0.12)] transition">
                    &larr; Home
                </a>
            </div>
        </div>
    </header>

    <!-- Odesli Frosted Glass Smartlink Container -->
    <main class="relative z-10 max-w-lg mx-auto w-full px-4 py-8 sm:py-12 flex-1">
        <div class="bg-[#141414]/75 backdrop-blur-2xl rounded-3xl shadow-[0_0_0_1px_rgba(255,255,255,0.12)] p-6 sm:p-8 space-y-6">

            <!-- Odesli Card Header: Metadata & Quick Actions -->
            <div class="space-y-4 text-center">
                <div class="inline-flex items-center gap-2 bg-[#C85A32]/10 text-[#C85A32] text-xs font-mono uppercase tracking-[0.2em] px-3 py-1 rounded-full shadow-[0_0_0_1px_rgba(200,90,50,0.3)]">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#C85A32] animate-pulse"></span>
                    {{BADGE}}
                </div>

                <div class="space-y-1">
                    <h1 class="font-serif text-2xl sm:text-3xl font-semibold text-white tracking-[-0.025em] leading-tight">
                        {{TITLE}}
                    </h1>
                    <p class="text-sm font-medium text-neutral-400">
                        {{ARTIST}}
                    </p>
                </div>

                <!-- Odesli Quick Action Chips -->
                <div class="flex items-center justify-center gap-2 pt-1">
                    <button id="share-btn"
                            class="h-8 px-3.5 rounded-full bg-white/5 hover:bg-white/10 text-neutral-300 hover:text-white text-xs font-mono uppercase tracking-wider flex items-center gap-1.5 shadow-[0_0_0_1px_rgba(255,255,255,0.08)] transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                        <i data-lucide="share-2" class="w-3 h-3 text-[#C85A32]"></i>
                        <span>Deel link</span>
                    </button>
                    <a href="/boeken.html"
                       class="h-8 px-3.5 rounded-full bg-white/5 hover:bg-white/10 text-neutral-300 hover:text-white text-xs font-mono uppercase tracking-wider flex items-center gap-1.5 shadow-[0_0_0_1px_rgba(255,255,255,0.08)] transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                        <i data-lucide="calendar" class="w-3 h-3 text-neutral-400"></i>
                        <span>Boek band</span>
                    </a>
                </div>
            </div>

            <!-- Integrated Video Player Frame -->
            {{VIDEO_SECTION}}

            <!-- Odesli Platform List Section -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between px-1">
                    <span class="text-xs font-mono uppercase tracking-[0.2em] text-neutral-400">Stream op</span>
                    <span class="text-xs font-mono text-neutral-500">Kies platform</span>
                </div>

                <div class="space-y-2">
                    {{PLATFORMS_LIST}}
                </div>
            </div>

            <!-- Booking Callout (Odesli Card Footer) -->
            <div class="pt-4 shadow-[0_-1px_0_0_rgba(255,255,255,0.08)] text-center">
                <a href="/boeken.html"
                   class="inline-flex items-center justify-center gap-2 w-full h-11 px-6 rounded-full bg-[#C85A32] hover:bg-[#B34E2A] text-white text-xs font-mono uppercase tracking-wider shadow-[0_0_0_1px_rgba(200,90,50,0.5)] transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                    <span>Boek ons voor een optreden</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Toast Feedback Notification -->
    <div id="toast-feedback"
         class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-[#141414] text-white px-5 py-2.5 rounded-full shadow-[0_0_0_1px_rgba(255,255,255,0.15)] text-xs font-mono uppercase tracking-wider opacity-0 translate-y-2 pointer-events-none transition duration-300 z-50 flex items-center gap-2">
        <i data-lucide="check" class="w-3.5 h-3.5 text-[#C85A32]"></i>
        Link gekopieerd naar klembord
    </div>

    <!-- Editorial Footer -->
    <footer class="relative z-10 bg-[#08090A] shadow-[0_-1px_0_0_rgba(255,255,255,0.08)] py-6 px-4 text-center text-xs font-mono text-neutral-400">
        <div class="max-w-4xl mx-auto space-y-1">
            <p>{{ARTIST}} | Muziek voor en door iedereen</p>
            <p>Boekingen &amp; informatie: <a href="tel:0628143815" class="text-white hover:underline">06 28 14 38 15</a></p>
        </div>
    </footer>

</body>
</html>
